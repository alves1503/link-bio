<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./assets/css/style.css" type="text/css">
  <script src="https://kit.fontawesome.com/7627166196.js" crossorigin="anonymous"></script>
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  <meta name="author" content="Henrique Alves">
  <meta name="description"
    content="Perfil de links de Henrique Alves com tema claro/escuro, tecnologias e contatos profissionais.">
  <script src="./assets/js/app.js" defer></script>
  <script type="module" src="./assets/js/dev-game.js"></script>
  <title>Henrique Alves — Link Bio</title>
</head>

<body>
  <canvas id="bgCanvas"></canvas>

  <main>
    <!-- Perfil e Redes Consolidados -->
    <section class="perfil section-card animate-fade">
      <div class="perfil-header">
        <img class="perfil-img" src="./assets/img/foto.jpeg" alt="Henrique Alves">
        <p class="label">Desenvolvedor Full-Stack</p>
        <h1>Henrique <strong>Alves</strong></h1>
        <a href="https://www.instagram.com/alvezwx05/" target="_blank" class="arroba">@alvezwx05</a>
      </div>
      <p class="bio">Projetos modernos com foco em impacto visual e performance. Estudante de ADS com experiência em
        soluções reais.</p>

      <div class="logoSocialMidia">
        <a href="https://www.instagram.com/alvezwx05/" target="_blank" aria-label="Instagram"><i
            class="fa-brands fa-instagram"></i></a>
        <a href="https://www.linkedin.com/in/henriquedev15/" target="_blank" aria-label="LinkedIn"><i
            class="fa-brands fa-linkedin-in"></i></a>
        <a href="https://github.com/alves1503" target="_blank" aria-label="GitHub"><i
            class="fa-brands fa-github"></i></a>
      </div>
    </section>

    <!-- Ações Principais (Botões) -->
    <section class="extras section-card animate-fade delay-1">
      <a href="https://portifolio-alves-five.vercel.app/" target="_blank">
        <button class="btn portifolio">
          <i class="fa-solid fa-globe"></i>
          <span>Acessar Portfólio</span>
        </button>
      </a>
      <a href="./assets/curriculo/Curriculo-Henrique.pdf" target="_blank">
        <button class="btn curriculo">
          <i class="fa-solid fa-file-arrow-down"></i>
          <span>Baixar Currículo</span>
        </button>
      </a>
    </section>

    <!-- Tecnologias -->
    <section class="tech section-card animate-fade delay-2">
      <div class="tech-row">
        <div class="iconsScroller" aria-hidden="true">
          <div class="iconsTrack">
            <i class="fa-brands fa-html5" title="HTML5"></i>
            <i class="fa-brands fa-css3-alt" title="CSS3"></i>
            <i class="fa-brands fa-js" title="JavaScript"></i>
            <i class="fa-brands fa-react" title="React"></i>
            <i class="fa-brands fa-node-js" title="Node.js"></i>
            <i class="fa-brands fa-php" title="PHP"></i>
            <i class="fa-brands fa-python" title="Python"></i>
            <i class="fa-solid fa-database" title="MySQL"></i>
            <i class="fa-brands fa-docker" title="Docker"></i>
            <i class="fa-brands fa-git-alt" title="Git"></i>
            <i class="fa-brands fa-github" title="GitHub"></i>
            <i class="fa-brands fa-figma" title="Figma"></i>
            <i class="fa-brands fa-html5" title="HTML5"></i>
            <i class="fa-brands fa-css3-alt" title="CSS3"></i>
            <i class="fa-brands fa-js" title="JavaScript"></i>
            <i class="fa-brands fa-react" title="React"></i>
            <i class="fa-brands fa-node-js" title="Node.js"></i>
            <i class="fa-brands fa-php" title="PHP"></i>
            <i class="fa-brands fa-python" title="Python"></i>
            <i class="fa-solid fa-database" title="MySQL"></i>
            <i class="fa-brands fa-docker" title="Docker"></i>
            <i class="fa-brands fa-git-alt" title="Git"></i>
            <i class="fa-brands fa-github" title="GitHub"></i>
            <i class="fa-brands fa-figma" title="Figma"></i>
          </div>
        </div>
      </div>
    </section>

    <!-- Dev game loop -->
    <section class="dev-game animate-fade delay-3"
      aria-label="Personagem explorando e interagindo com uma fase retrô de programação">
      <div class="game-scene" id="gameScene">
        <canvas id="devGameCanvas"
          aria-label="Animação contínua de um personagem programador explorando um mundo retrô e interagindo com seus objetos"></canvas>
      </div>
    </section>

    <footer class="creditos animate-fade delay-4">
      <h3><strong>H/A</strong></h3>
      <p>© 2026 Henrique Alves. Todos os direitos reservados.</p>
    </footer>
  </main>

  <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
    <i class="fa-solid fa-moon"></i>
  </button>
</body>

</html>
